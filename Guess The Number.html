<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess The Number</title>
</head>
<body>
    <h1>Guess the Number</h1>
    <input id="guessnumber">
    <button onclick="check()">Check</button>
    <p id="result">Right/Wrong</p>
    <p id="score">Score:10</p>
    <script>
        var guessnumber=document.getElementById("guessnumber");
        var result=document.getElementById("result");
        var random=Math.floor(Math.random()*10)+1;
        var scorevalue=document.getElementById("score");
        var score=10
        function check(){
            var enternumber=guessnumber.value;
            if(random==enternumber){
                result.textContent="Your are Right";
            }
            else{
                score=score-1;
                scorevalue.textContent="Score:"+score;
                result.textContent="Your are Wrong"
            }
        }

    </script>

    
</body>
</html>
